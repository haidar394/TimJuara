<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cupShine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle inner border overlay -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Trophy Graphic Group with shadow -->
  <g filter="url(#glow)">
    <!-- Trophy Handles / Ears -->
    <path d="M 152 168 C 96 168, 80 236, 128 276 C 148 292, 172 296, 192 292" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 360 168 C 416 168, 432 236, 384 276 C 364 292, 340 296, 320 292" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Main Trophy Cup Body -->
    <path d="M 160 144 L 352 144 C 352 232, 320 296, 256 312 C 192 296, 160 232, 160 144 Z" fill="url(#goldGrad)"/>

    <!-- Cup Rim -->
    <rect x="144" y="128" width="224" height="28" rx="14" fill="#fef08a"/>

    <!-- Cup Highlight / Shine -->
    <path d="M 174 156 L 220 156 C 210 230, 230 266, 256 296 C 210 282, 178 230, 174 156 Z" fill="url(#cupShine)"/>

    <!-- Star Emblem on Cup -->
    <path d="M 256 192 L 265 214 L 288 214 L 269 228 L 276 250 L 256 236 L 236 250 L 243 228 L 224 214 L 247 214 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Trophy Stem / Neck -->
    <path d="M 236 308 L 276 308 L 272 360 L 240 360 Z" fill="url(#goldGrad)"/>
    <rect x="226" y="348" width="60" height="18" rx="8" fill="#fef08a"/>

    <!-- Trophy Pedestal / Base -->
    <path d="M 184 366 L 328 366 L 344 406 L 168 406 Z" fill="#1e1b4b" opacity="0.6"/>
    <rect x="160" y="396" width="192" height="28" rx="10" fill="url(#goldGrad)"/>
    <rect x="176" y="400" width="160" height="8" rx="4" fill="#fef08a" opacity="0.6"/>
  </g>
</svg>
